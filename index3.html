        * {

        .background {

            background-repeat: no-repeat;
            background-position: center;
            background-color: #1a1a1a;

        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
        }

        header h1 {
            font-size: 2.5rem;
            border-bottom: 3px solid #b5d333;
            padding-bottom: 10px;
        }

        nav { width: 100%; max-width: 450px; }
        ul { list-style: none; }
        li { margin-bottom: 15px; }

        a.nav-btn {
            display: flex;
            align-items: center;      
            justify-content: center;
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.3s;
            position: relative;        
            overflow: hidden;
        }

        .nav-icon {
            position: absolute;        
            left: 20px;
            top: 50%;
            transform: translateY(-50%); /* 加上垂直置中，確保不同大小的圖示都在按鈕中間 */
            width: 35px;
            height: auto;
            pointer-events: none;
        }

        /* 預設的花（lower_icon）尺寸調小 */
        .icon-default {
            width: 26px;
        }

        /* 移到選單時顯示的釋迦（open）尺寸調大 */
        .icon-hover {
            display: none;
            width: 44px;
        }

        /* 當滑鼠移到選單（a.nav-btn:hover）時的切換隱現邏輯 */
        a.nav-btn:hover .icon-default {
            display: none; /* 隱藏花（lower_icon） */
        }
        a.nav-btn:hover .icon-hover {
            display: block; /* 顯示釋迦（open） */
        }

        .svg-icon {
            fill: #ff4d4d;
            transition: 0.3s;
        }

        a.nav-btn span {
            display: inline-block;
            text-align: center;
        }

        a.nav-btn:hover {
            background: rgba(181, 211, 51, 0.9);
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            color: #1a1a1a;
        }
        
        a.nav-btn:hover .svg-icon {
            fill: #1a1a1a;
        }

        footer {
            margin-top: auto;
            color: white;
            padding: 20px;
            font-size: 0.85rem;
            text-align: center;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.8rem; }
            a.nav-btn { font-size: 1.1rem; padding: 14px 20px; }
            .nav-icon { left: 15px; width: 30px; }
            /* 手機版同步調整比例 */
            .icon-default { width: 22px; }
            .icon-hover { width: 36px; }
        }
    </style>
