    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        body, html {
            height: 100%;
        }

        /* 背景圖片 */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-image: url('1632.webp');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            background-color: #1a1a1a;
            z-index: -1;

            filter: brightness(0.7);
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 60px 20px;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;

            color: white;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
        }

        header h1 {
            font-size: 2.5rem;
            border-bottom: 3px solid #b5d333;
            padding-bottom: 10px;
        }

        /* 副標題小字樣式 */
        header p.subtitle {
            font-size: 0.95rem;
            margin-top: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: normal;
            letter-spacing: 0.8px;
            line-height: 1.5;
        }

        nav {
            width: 100%;
            max-width: 450px;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 15px;
        }

        a.nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;
            color: #fff;

            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            padding: 15px 20px;

            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);

            font-size: 1.2rem;
            font-weight: bold;

            transition: 0.3s;

            position: relative;
            overflow: hidden;
        }

        /* 所有左側圖示 */
        .nav-icon {
            position: absolute;

            left: 20px;
            top: 50%;

            transform: translateY(-50%);

            width: 35px;
            height: auto;

            pointer-events: none;
        }

        /* 一般按鈕原始小花 */
        .icon-default {
            width: 26px;
        }

        /* 一般按鈕滑鼠移入後顯示的果實 */
        .icon-hover {
            display: none;
            width: 44px;
        }

        /* BH-01 候選株專用圖示尺寸與位置調整 */
        .candidate-icon {
            left: 8px;
        }

        .candidate-icon.icon-default {
            width: 42px;
        }

        .candidate-icon.icon-hover {
            width: 56px;
        }

        /* 選單 hover 圖示切換 */
        a.nav-btn:hover .icon-default {
            display: none;
        }

        a.nav-btn:hover .icon-hover {
            display: block;
        }

        /* YouTube 圖示 */
        .svg-icon {
            fill: #ff4d4d;
            transition: 0.3s;
        }

        a.nav-btn span {
            display: inline-block;
            text-align: center;
        }

        /* 按鈕滑鼠效果 */
        a.nav-btn:hover {
            background: rgba(181, 211, 51, 0.9);

            transform: scale(1.03);

            box-shadow: 0 5px 15px rgba(0,0,0,0.4);

            color: #1a1a1a;
        }

        a.nav-btn:hover .svg-icon {
            fill: #1a1a1a;
        }

        footer {
            margin-top: auto;

            color: white;

            padding: 20px;

            font-size: 0.85rem;

            text-align: center;

            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        /* 手機版 */
        @media (max-width: 480px) {

            header h1 {
                font-size: 1.8rem;
            }

            header p.subtitle {
                font-size: 0.85rem;
                margin-top: 10px;
            }

            a.nav-btn {
                font-size: 1.1rem;
                padding: 14px 20px;
            }

            .nav-icon {
                left: 15px;
                width: 30px;
            }

            .icon-default {
                width: 22px;
            }

            .icon-hover {
                width: 36px;
            }

            .candidate-icon {
                left: 8px;
            }

            .candidate-icon.icon-default {
                width: 34px;
            }

            .candidate-icon.icon-hover {
                width: 46px;
            }
        }
    </style>
